# SPDX-License-Identifier: Apache-2.0
# E2E only: Caddy with its own local CA terminates TLS on the test ports and
# forwards to the app's published ports (scripts/ci/e2e.sh).
services:
  https:
    image: caddy:2-alpine
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # The caddy binary carries this file capability; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      E2E_PORT: ${E2E_PORT:?}
      E2E_CONTENT_PORT: ${E2E_CONTENT_PORT:?}
      APP_PORT: ${COURSECRAFT_HTTP_PORT:?}
      APP_CONTENT_PORT: ${COURSECRAFT_CONTENT_HTTP_PORT:?}
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    volumes:
      # Relative to the project directory (the first compose file).
      - ./tests/e2e/stack/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp
    depends_on:
      app: { condition: service_healthy }
