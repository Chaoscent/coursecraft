# Overlay for the offline test: no network has a route to the outside.
# Usage: scripts/ci/test-offline.sh
networks:
  edge:
    internal: true

services:
  app:
    environment:
      COURSECRAFT_PUBLIC_URL: http://localhost:3000
    # Ports cannot be published from internal-only networks.
    ports: !reset []
