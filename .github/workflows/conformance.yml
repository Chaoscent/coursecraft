# SPDX-License-Identifier: Apache-2.0
# SCORM packages in a real LMS (Moodle 4.5 LTS). Weekly and on demand, not on
# every push: it installs a whole Moodle and takes several minutes.
name: Conformance

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moodle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install -g --ignore-scripts "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/build-images.sh
      - run: CI=true scripts/ci/test-moodle.sh
