# SPDX-License-Identifier: Apache-2.0
# Chardsoft Coursecraft on one server. Needs only this file and a .env file
# (see .env.example); the images come from the GitHub container registry.
#   docker compose up -d
# Building from source instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Requires Docker Engine 26+ / Compose 2.30+ (volume subpaths).

name: coursecraft

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped

# init, migrate and maintenance use the app image.
x-app-image: &app-image
  image: ${COURSECRAFT_APP_IMAGE:-ghcr.io/chaoscent/coursecraft-app:${COURSECRAFT_VERSION:-latest}}

services:
  # One-shot: creates per-service secrets on first start (idempotent).
  init:
    <<: *app-image
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    environment:
      COURSECRAFT_DB_HOST: db
      COURSECRAFT_DB_NAME: coursecraft
    command: ['node', '/app/dist/cli.js', 'init-secrets', '/secrets']
    volumes:
      - secrets:/secrets

  db:
    image: postgres:17-trixie
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      POSTGRES_DB: coursecraft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/coursecraft/postgres_password
    volumes:
      - db:/var/lib/postgresql/data
      - type: volume
        source: secrets
        target: /run/coursecraft
        read_only: true
        volume: { subpath: db }
    networks: [backend]
    shm_size: 128m
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coursecraft']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: service roles (idempotent), then migrations and the job-queue
  # schema with the only DDL-capable role.
  migrate:
    <<: [*app-image, *hardening]
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }
    environment:
      COURSECRAFT_ADMIN_DATABASE_URL_FILE: /run/coursecraft/admin_database_url
      COURSECRAFT_MIGRATOR_PASSWORD_FILE: /run/coursecraft/migrator_password
      COURSECRAFT_APP_PASSWORD_FILE: /run/coursecraft/app_password
      COURSECRAFT_CONVERTER_PASSWORD_FILE: /run/coursecraft/converter_password
      COURSECRAFT_MIGRATOR_DATABASE_URL_FILE: /run/coursecraft/database_url
    command: ['/bin/sh', '-c', 'node /app/dist/cli.js db-bootstrap && node /app/dist/cli.js migrate']
    volumes:
      - type: volume
        source: secrets
        target: /run/coursecraft
        read_only: true
        volume: { subpath: migrate }
    networks: [backend]

  app:
    <<: [*hardening]
    image: ${COURSECRAFT_APP_IMAGE:-ghcr.io/chaoscent/coursecraft-app:${COURSECRAFT_VERSION:-latest}}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      COURSECRAFT_PUBLIC_URL: ${COURSECRAFT_PUBLIC_URL:?set COURSECRAFT_PUBLIC_URL in .env}
      COURSECRAFT_CONTENT_URL: ${COURSECRAFT_CONTENT_URL:-}
      COURSECRAFT_TRUST_PROXY: ${COURSECRAFT_TRUST_PROXY:-false}
      COURSECRAFT_LOG_LEVEL: ${COURSECRAFT_LOG_LEVEL:-info}
      COURSECRAFT_SESSION_IDLE_MINUTES: ${COURSECRAFT_SESSION_IDLE_MINUTES:-60}
      COURSECRAFT_SESSION_ABSOLUTE_HOURS: ${COURSECRAFT_SESSION_ABSOLUTE_HOURS:-12}
      COURSECRAFT_LOGIN_RATE_LIMIT: ${COURSECRAFT_LOGIN_RATE_LIMIT:-10}
      COURSECRAFT_TIME_ZONE: ${COURSECRAFT_TIME_ZONE:-Europe/Berlin}
      COURSECRAFT_AI_ENABLED: ${COURSECRAFT_AI_ENABLED:-false}
      COURSECRAFT_AI_TIMEOUT_SECONDS: ${COURSECRAFT_AI_TIMEOUT_SECONDS:-90}
      COURSECRAFT_AI_RATE_LIMIT: ${COURSECRAFT_AI_RATE_LIMIT:-10}
      COURSECRAFT_DATABASE_URL_FILE: /run/coursecraft/database_url
      COURSECRAFT_MASTER_KEY_FILE: /run/coursecraft/master_key
      COURSECRAFT_IP_PEPPER_FILE: /run/coursecraft/ip_pepper
    ports:
      - '${COURSECRAFT_BIND_ADDRESS:-127.0.0.1}:${COURSECRAFT_HTTP_PORT:-3000}:3000'
      # Content origin (course playback); used only when COURSECRAFT_CONTENT_URL is set.
      - '${COURSECRAFT_BIND_ADDRESS:-127.0.0.1}:${COURSECRAFT_CONTENT_HTTP_PORT:-3001}:3001'
    volumes:
      - data:/data
      - work:/work
      - type: volume
        source: secrets
        target: /run/coursecraft
        read_only: true
        volume: { subpath: app }
    tmpfs:
      - /tmp:size=256m
    networks: [edge, backend]
    mem_limit: 512m

  converter:
    <<: [*hardening]
    image: ${COURSECRAFT_CONVERTER_IMAGE:-ghcr.io/chaoscent/coursecraft-converter:${COURSECRAFT_VERSION:-latest}}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      COURSECRAFT_CONVERTER_DATABASE_URL_FILE: /run/coursecraft/database_url
      COURSECRAFT_CONVERTER_CONCURRENCY: ${COURSECRAFT_CONVERTER_CONCURRENCY:-1}
    volumes:
      - work:/work
      - type: volume
        source: secrets
        target: /run/coursecraft
        read_only: true
        volume: { subpath: converter }
    tmpfs:
      - /tmp:size=1g
    networks: [backend]
    mem_limit: 1g
    cpus: ${COURSECRAFT_CONVERTER_CPUS:-2}
    pids_limit: 256

  # On demand only: `docker compose --profile maintenance run --rm maintenance restore <file>`.
  # Has the DDL-capable role and the data volume; stop app and converter first.
  maintenance:
    <<: [*app-image, *hardening]
    profiles: [maintenance]
    restart: 'no'
    environment:
      COURSECRAFT_MIGRATOR_DATABASE_URL_FILE: /run/coursecraft/database_url
      COURSECRAFT_DATA_DIR: /data
    entrypoint: ['node', '/app/dist/cli.js']
    volumes:
      - data:/data
      - type: volume
        source: secrets
        target: /run/coursecraft
        read_only: true
        volume: { subpath: migrate }
    tmpfs:
      - /tmp:size=64m
    networks: [backend]

networks:
  edge: {}
  # No route to the outside world: database and converter live only here.
  backend:
    internal: true

volumes:
  db:
  data:
  work:
  secrets:
