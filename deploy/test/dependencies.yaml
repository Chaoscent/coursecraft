# SPDX-License-Identifier: Apache-2.0
# Stand-ins for what a real cluster has outside the chart: PostgreSQL, an
# S3-compatible service and the Secrets the chart refers to. Test use only.
apiVersion: v1
kind: Namespace
metadata: { name: cc }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pg, namespace: cc }
spec:
  replicas: 1
  selector: { matchLabels: { app: pg } }
  template:
    metadata: { labels: { app: pg } }
    spec:
      containers:
        - name: pg
          image: postgres:17-trixie
          imagePullPolicy: Never
          env:
            - { name: POSTGRES_PASSWORD, value: admin-secret-1234 }
            - { name: POSTGRES_DB, value: coursecraft }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: pg, namespace: cc }
spec: { selector: { app: pg }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: s3, namespace: cc }
spec:
  replicas: 1
  selector: { matchLabels: { app: s3 } }
  template:
    metadata: { labels: { app: s3 } }
    spec:
      containers:
        - name: s3
          image: zenko/cloudserver:latest
          imagePullPolicy: Never
          env:
            - { name: S3BACKEND, value: mem }
            - { name: SCALITY_ACCESS_KEY_ID, value: k8s-access-key }
            - { name: SCALITY_SECRET_ACCESS_KEY, value: k8s-secret-key-0123456789 }
            - { name: REMOTE_MANAGEMENT_DISABLE, value: '1' }
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: s3, namespace: cc }
spec: { selector: { app: s3 }, ports: [{ port: 8000 }] }
---
apiVersion: v1
kind: Secret
metadata: { name: admin-db, namespace: cc }
stringData: { url: 'postgres://postgres:admin-secret-1234@pg.cc.svc:5432/coursecraft?sslmode=disable' }
---
apiVersion: v1
kind: Secret
metadata: { name: s3-keys, namespace: cc }
stringData: { accessKeyId: k8s-access-key, secretAccessKey: k8s-secret-key-0123456789 }
---
# Separate converter key (same throwaway CloudServer creds; the chart only checks the Secret name).
apiVersion: v1
kind: Secret
metadata: { name: s3-converter-keys, namespace: cc }
stringData: { accessKeyId: k8s-access-key, secretAccessKey: k8s-secret-key-0123456789 }
