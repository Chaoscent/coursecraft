{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if .Values.operator.enabled }}
{{- $secret := include "coursecraft.secretName" . }}
{{- $fs := eq .Values.storage.kind "fs" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coursecraft.fullname" . }}-operator
  labels: {{- include "coursecraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  # Sessions live in memory: one replica.
  replicas: 1
  selector:
    matchLabels: {{- include "coursecraft.selector" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels: {{- include "coursecraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10000
        {{- if $fs }}
        fsGroup: 10000
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: {{ .Values.image.app }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, /app/dist/operator-main.js]
          ports:
            - { name: http, containerPort: 3002 }
          env:
            - name: COURSECRAFT_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: migratorPassword } }
            - name: COURSECRAFT_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: appPassword } }
            - name: COURSECRAFT_MIGRATOR_DATABASE_URL
              value: {{ include "coursecraft.dbUrl" (list "coursecraft_migrator" "COURSECRAFT_MIGRATOR_PASSWORD" .) | quote }}
            - name: COURSECRAFT_DATABASE_URL
              value: {{ include "coursecraft.dbUrl" (list "coursecraft_app" "COURSECRAFT_APP_PASSWORD" .) | quote }}
            - name: COURSECRAFT_OPERATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: operatorPassword } }
            {{- if $fs }}
            - { name: COURSECRAFT_DATA_DIR, value: /data }
            {{- end }}
            {{- include "coursecraft.storageEnv" . | nindent 12 }}
            {{- if eq .Values.storage.kind "s3" }}
            - name: COURSECRAFT_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.storage.s3.secret }}, key: accessKeyId } }
            - name: COURSECRAFT_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.storage.s3.secret }}, key: secretAccessKey } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          {{- include "coursecraft.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if $fs }}
            - { name: data, mountPath: /data }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if $fs }}
        - name: data
          persistentVolumeClaim: { claimName: {{ default (printf "%s-data" (include "coursecraft.fullname" .)) .Values.storage.fs.existingDataClaim }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coursecraft.fullname" . }}-operator
  labels: {{- include "coursecraft.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "coursecraft.selector" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - { name: http, port: 3002, targetPort: http }
{{- end }}
