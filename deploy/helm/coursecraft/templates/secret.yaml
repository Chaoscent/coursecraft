{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "coursecraft.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $old }}{{ $data = $old.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "coursecraft.labels" . | nindent 4 }}
  annotations:
    # The master key seals data in the database; losing or replacing it makes that data unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  masterKey: {{ default (randBytes 32 | b64enc) (index $data "masterKey") }}
  ipPepper: {{ default (randBytes 32 | b64enc) (index $data "ipPepper") }}
  migratorPassword: {{ default (randAlphaNum 40 | b64enc) (index $data "migratorPassword") }}
  appPassword: {{ default (randAlphaNum 40 | b64enc) (index $data "appPassword") }}
  converterPassword: {{ default (randAlphaNum 40 | b64enc) (index $data "converterPassword") }}
{{- end }}
