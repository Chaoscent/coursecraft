# SPDX-License-Identifier: Apache-2.0
# Chardsoft Coursecraft on Kubernetes. See docs/kubernetes.md.

image:
  # Published images (GitHub container registry); your own builds work too
  # (docker/Dockerfile, targets "app" and "converter").
  app: ghcr.io/chaoscent/coursecraft-app
  converter: ghcr.io/chaoscent/coursecraft-converter
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public address of the application and the second origin that plays courses.
# Both need DNS names that point at the ingress and TLS certificates.
publicUrl: https://courses.example.com
contentUrl: https://courses-content.example.com

# "single": one organisation (the default). "multi": several organisations,
# each under its own addresses; add them with deploy/helm/coursecraft-tenant.sh.
tenancy: single

replicas:
  app: 2
  converter: 1

# How the application is configured (see .env.example).
config:
  logLevel: info
  timeZone: Europe/Berlin
  sessionIdleMinutes: 60
  sessionAbsoluteHours: 12
  loginRateLimit: 10
  uploadMaxMb: 500
  aiEnabled: false
  # Extra COURSECRAFT_* variables for the app, as name: value pairs.
  extraEnv: {}

database:
  # PostgreSQL 15 or newer, outside the chart (managed service, CloudNativePG, ...).
  host: ''
  port: 5432
  name: coursecraft
  # "require" for managed services; "disable" only inside a trusted network.
  sslmode: require
  # Create the three service roles and their privileges before migrating.
  # Needs an administrator account in a Secret with the key "url"
  # (postgres://user:password@host:5432/dbname).
  bootstrap:
    enabled: true
    adminSecret: ''

# Files: "s3" (object storage, any number of replicas) or "fs"
# (a ReadWriteMany volume shared by app and converter pods).
storage:
  kind: s3
  s3:
    endpoint: ''
    region: us-east-1
    bucket: ''
    keyPrefix: ''
    # Secret with the keys "accessKeyId" and "secretAccessKey".
    secret: ''
    # Optional second secret for the converter, restricted to the prefix "work/".
    converterSecret: ''
    virtualHostedStyle: false
  fs:
    storageClass: ''
    dataSize: 50Gi
    workSize: 10Gi
    # An existing ReadWriteMany claim instead of creating one.
    existingDataClaim: ''
    existingWorkClaim: ''

# Generated once and kept across upgrades unless an existing Secret is named.
# Keys: masterKey, ipPepper (32 random bytes, base64), migratorPassword,
# appPassword, converterPassword.
secrets:
  existingSecret: ''

ingress:
  enabled: true
  className: ''
  annotations:
    # Course packages and recordings can be large.
    nginx.ingress.kubernetes.io/proxy-body-size: 600m
  tls:
    app: courses-tls
    content: courses-content-tls
  # More addresses for tenants (tenancy: multi), for example wildcards:
  #   app: ['*.courses.example.com'], content: ['*.content.example.com']
  extraHosts:
    app: []
    content: []
  # TLS for those hosts: [{ secretName: wildcard-tls, hosts: ['*.courses.example.com'] }]
  extraTls: []

resources:
  app:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  converter:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '2', memory: 4Gi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true

networkPolicy:
  # Deny all traffic except from the ingress controller (label match below) and
  # allow the egress the pods need. Adjust to your cluster.
  enabled: false
  ingressControllerNamespace: ingress-nginx
  # Default-deny egress for the converter, which handles untrusted files
  # (SECURITY_AUDIT.md F-14). Independent of "enabled" above and on by default:
  # the converter then reaches only DNS, the database and (with s3) the object
  # storage, never the internet or the cloud metadata endpoint. A
  # NetworkPolicy cannot match host names, so give destinations as in-cluster
  # selectors or as address ranges (managed services).
  converter:
    enabled: true
    # PostgreSQL. At least one of cidrs / podSelector / namespaceSelector is
    # required while this policy is enabled (a managed DB by CIDR, an
    # in-cluster DB such as CloudNativePG by selector).
    database:
      cidrs: []
      podSelector: {}
      namespaceSelector: {}
    # Object storage (storage.kind=s3). Prefer a selector (in-cluster MinIO/Ceph)
    # or the narrow CIDRs of a VPC endpoint. 0.0.0.0/0 is the last-resort
    # fallback for public S3 without a VPC endpoint: it allows outbound HTTPS
    # anywhere, with the link-local range (169.254.0.0/16, cloud metadata)
    # excluded automatically. Policies match pod IPs, not Service ClusterIPs.
    objectStorage:
      cidrs: []
      podSelector: {}
      namespaceSelector: {}
      port: 443
    # The cluster DNS service (kube-dns/CoreDNS); adjust if yours differs.
    dns:
      namespaceSelector: { kubernetes.io/metadata.name: kube-system }
      podSelector: { k8s-app: kube-dns }

# Operator console (organisations, limits, usage). Not exposed: reach it with
#   kubectl port-forward svc/<release>-operator 3002:3002
# Password: key "operatorPassword" of the chart's Secret.
operator:
  enabled: false

# Optional billing with Stripe (tenancy: multi, see docs/billing.md). Name of
# an existing Secret with the keys "secretKey" (sk_…, used by the operator
# console) and "webhookSecret" (whsec_…, used by the app's webhook
# <publicUrl>/api/billing/stripe/webhook). Empty = off.
billing:
  stripeSecret: ''

metrics:
  enabled: true
  port: 9464
  serviceMonitor:
    enabled: false
    interval: 30s

backup:
  # Nightly database backup. With object storage it is uploaded to "backups/"
  # in the bucket; with a shared volume it lands in /data/backups.
  enabled: true
  schedule: '17 2 * * *'
  # Backups kept in the bucket or on the volume are not pruned by the chart;
  # use a lifecycle rule on the bucket.

nodeSelector: {}
tolerations: []
affinity: {}
